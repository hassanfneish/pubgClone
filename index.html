<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ZONE WARS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1f14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Chivo+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14170f;
    --bg2: #1c2116;
    --olive: #7c8f4a;
    --olive-dim: #4a5630;
    --orange: #ff6a1f;
    --red: #e2402f;
    --paper: #d8d6c4;
    --ink: #0c0d09;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); color:var(--paper);
    font-family:'Chivo Mono', monospace;
    overflow:hidden; position:fixed; inset:0;
    touch-action:none;
  }
  h1,h2,.hud-num,.btn,.code-display{ font-family:'Teko', sans-serif; }

  .screen{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(124,143,74,0.18), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
      var(--bg);
    padding:24px; text-align:center;
  }
  .hidden{ display:none !important; }

  .logo{
    font-size:64px; font-weight:700; letter-spacing:6px; line-height:0.85;
    color:var(--paper); margin:0 0 4px;
    text-shadow: 3px 3px 0 var(--olive-dim), 0 0 30px rgba(255,106,31,0.25);
  }
  .logo span{ color:var(--orange); }
  .tagline{
    font-size:13px; letter-spacing:4px; color:var(--olive); margin-bottom:48px;
    text-transform:uppercase; opacity:0.85;
  }

  .stack{ display:flex; flex-direction:column; gap:14px; width:100%; max-width:320px; }

  .btn{
    font-size:26px; letter-spacing:2px; font-weight:600;
    padding:16px 20px; border:2px solid var(--olive); background:rgba(124,143,74,0.08);
    color:var(--paper); border-radius:2px; cursor:pointer;
    text-transform:uppercase; position:relative; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 100%, 14px 100%);
    transition: transform .08s ease, background .15s ease;
  }
  .btn:active{ transform:scale(0.97); background:rgba(124,143,74,0.25); }
  .btn.primary{ background:var(--orange); border-color:var(--orange); color:var(--ink); }
  .btn.primary:active{ background:#ff7f3d; }
  .btn.ghost{ border-color:var(--olive-dim); color:var(--olive); background:transparent; font-size:16px; padding:10px; clip-path:none; letter-spacing:3px; }

  input.code-input{
    font-family:'Teko', sans-serif; font-size:34px; letter-spacing:10px; text-align:center;
    background:var(--bg2); border:2px solid var(--olive-dim); color:var(--paper);
    padding:12px; width:100%; border-radius:2px; text-transform:uppercase;
  }
  input.code-input:focus{ outline:none; border-color:var(--orange); }

  .code-display{
    font-size:72px; letter-spacing:14px; color:var(--orange); font-weight:700;
    background:var(--bg2); border:2px dashed var(--olive-dim); padding:10px 24px;
    margin:20px 0; border-radius:2px;
  }
  .pulse-dot{
    width:8px; height:8px; border-radius:50%; background:var(--orange);
    display:inline-block; margin-right:8px; animation:pulse 1.1s infinite ease-in-out;
  }
  @keyframes pulse{ 0%,100%{opacity:.25; transform:scale(0.8);} 50%{opacity:1; transform:scale(1.2);} }
  .waiting-txt{ font-size:14px; letter-spacing:2px; color:var(--olive); text-transform:uppercase; }
  .err-txt{ color:var(--red); font-size:13px; letter-spacing:1px; min-height:18px; margin-top:6px; }

  /* GAME SCREEN */
  #screen-game{ padding:0; background:var(--ink); }
  #arenaWrap{ position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas{ display:block; background:#10130c; touch-action:none; }

  .hud{ position:absolute; inset:0; pointer-events:none; }
  .hud-top{
    position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between;
    padding:calc(10px + env(safe-area-inset-top)) 14px 0; gap:10px;
  }
  .bar-box{ width:42%; max-width:180px; }
  .bar-label{ font-size:11px; letter-spacing:2px; color:var(--olive); margin-bottom:3px; text-transform:uppercase;}
  .bar-track{ height:14px; background:rgba(0,0,0,0.5); border:1px solid var(--olive-dim); border-radius:2px; overflow:hidden; }
  .bar-fill{ height:100%; background:linear-gradient(90deg, var(--olive), #a3bb5f); transition:width .2s linear; }
  .bar-fill.enemy{ background:linear-gradient(90deg, var(--red), #ff7a6a); margin-left:auto; }
  .bar-box.me .bar-label{ text-align:left; }
  .bar-box.enemy .bar-label{ text-align:right; }

  .zone-timer{
    position:absolute; top:calc(10px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    font-family:'Teko',sans-serif; font-size:22px; color:var(--orange); letter-spacing:2px;
    text-shadow:0 2px 6px rgba(0,0,0,0.8);
  }

  .stick-zone{
    position:absolute; bottom:0; width:50%; height:46%;
    pointer-events:auto;
  }
  #moveZone{ left:0; }
  #aimZone{ right:0; }
  .stick-base{
    position:absolute; width:104px; height:104px; border-radius:50%;
    border:2px solid rgba(216,214,196,0.35); background:rgba(216,214,196,0.06);
    display:none;
  }
  .stick-nub{
    position:absolute; width:46px; height:46px; border-radius:50%;
    background:rgba(216,214,196,0.5); top:50%; left:50%; transform:translate(-50%,-50%);
  }
  #aimZone .stick-nub{ background:rgba(255,106,31,0.65); }

  .connbadge{
    position:absolute; bottom:calc(8px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    font-size:10px; letter-spacing:2px; color:var(--olive-dim); text-transform:uppercase;
  }

  /* GAME OVER */
  #screen-gameover .result{ font-size:56px; margin-bottom:6px; }
  #screen-gameover .result.win{ color:var(--olive); }
  #screen-gameover .result.lose{ color:var(--red); }
</style>
</head>
<body>

<div id="screen-home" class="screen">
  <h1 class="logo">ZONE<span>WARS</span></h1>
  <div class="tagline">last one breathing wins</div>
  <div class="stack">
    <button class="btn primary" id="btnCreate">Create Room</button>
    <button class="btn" id="btnShowJoin">Join Room</button>
  </div>
  <div id="joinBox" class="stack hidden" style="margin-top:16px;">
    <input class="code-input" id="joinInput" maxlength="5" placeholder="CODE" autocapitalize="characters">
    <button class="btn primary" id="btnJoin">Join</button>
    <div class="err-txt" id="joinErr"></div>
  </div>
</div>

<div id="screen-waiting" class="screen hidden">
  <div class="waiting-txt">room code — share with your opponent</div>
  <div class="code-display" id="roomCodeDisplay">-----</div>
  <div class="waiting-txt"><span class="pulse-dot"></span>waiting for player 2 to join…</div>
  <button class="btn ghost" id="btnCancelWait" style="margin-top:40px;">cancel</button>
</div>

<div id="screen-game" class="screen hidden">
  <div id="arenaWrap">
    <canvas id="canvas"></canvas>
    <div class="hud">
      <div class="hud-top">
        <div class="bar-box me">
          <div class="bar-label">YOU</div>
          <div class="bar-track"><div class="bar-fill" id="myHealthBar" style="width:100%"></div></div>
        </div>
        <div class="bar-box enemy">
          <div class="bar-label">ENEMY</div>
          <div class="bar-track"><div class="bar-fill enemy" id="enemyHealthBar" style="width:100%"></div></div>
        </div>
      </div>
      <div class="zone-timer" id="zoneTimer">ZONE SAFE</div>
      <div class="stick-zone" id="moveZone"><div class="stick-base" id="moveBase"><div class="stick-nub" id="moveNub"></div></div></div>
      <div class="stick-zone" id="aimZone"><div class="stick-base" id="aimBase"><div class="stick-nub" id="aimNub"></div></div></div>
      <div class="connbadge" id="connBadge">syncing…</div>
    </div>
  </div>
</div>

<div id="screen-gameover" class="screen hidden">
  <div class="result" id="resultText">YOU WIN</div>
  <div class="waiting-txt" id="resultSub" style="margin-bottom:36px;">enemy eliminated</div>
  <div class="stack">
    <button class="btn primary" id="btnPlayAgain">New Room</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------------- STORAGE ADAPTER ---------------- */
  const hasStorage = !!(window.storage && window.storage.set);
  async function sSet(key, value){
    if(!hasStorage) throw new Error("no-storage");
    return window.storage.set(key, JSON.stringify(value), true);
  }
  async function sGet(key){
    if(!hasStorage) throw new Error("no-storage");
    try{
      const r = await window.storage.get(key, true);
      return r ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }

  /* ---------------- STATE ---------------- */
  const ARENA = 1000;
  const PLAYER_R = 20;
  const BULLET_R = 6;
  const MOVE_SPEED = 260;
  const BULLET_SPEED = 700;
  const FIRE_COOLDOWN = 320;
  const BULLET_DAMAGE = 14;
  const ZONE_DURATION = 75000;
  const ZONE_START_R = 620;
  const ZONE_END_R = 90;
  const ZONE_DPS = 9;
  const WRITE_INTERVAL = 260;
  const POLL_INTERVAL = 300;

  let roomCode = null;
  let myId = null;       // 'p1' or 'p2'
  let oppId = null;
  let gameStartTime = null;
  let pollTimer = null, writeTimer = null;
  let rafId = null;
  let over = false;

  const me = { x: 300, y: 500, health: 100, angle: 0, shots: [], processedShots: new Set(), lastShotAt: 0 };
  const enemy = { x: 700, y: 500, health: 100, angle: 0, prevX:700, prevY:500, snapT:0, prevSnapT:0, seenShots: new Set(), alive:true, joined:false };

  /* ---------------- SCREENS ---------------- */
  const screens = {
    home: document.getElementById('screen-home'),
    waiting: document.getElementById('screen-waiting'),
    game: document.getElementById('screen-game'),
    over: document.getElementById('screen-gameover'),
  };
  function showScreen(name){
    Object.values(screens).forEach(s=>s.classList.add('hidden'));
    screens[name].classList.remove('hidden');
  }

  function randCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let c='';
    for(let i=0;i<5;i++) c += chars[Math.floor(Math.random()*chars.length)];
    return c;
  }

  /* ---------------- HOME / JOIN UI ---------------- */
  document.getElementById('btnShowJoin').addEventListener('click', ()=>{
    document.getElementById('joinBox').classList.toggle('hidden');
  });

  document.getElementById('btnCreate').addEventListener('click', async ()=>{
    if(!hasStorage){ alert('Online play needs Claude\\'s artifact environment — open this game as a Claude artifact link.'); return; }
    roomCode = randCode();
    myId = 'p1'; oppId = 'p2';
    document.getElementById('roomCodeDisplay').textContent = roomCode;
    showScreen('waiting');
    await sSet('zw:'+roomCode, { status:'waiting', createdAt: Date.now() });
    pollForOpponent();
  });

  document.getElementById('btnJoin').addEventListener('click', async ()=>{
    const errEl = document.getElementById('joinErr');
    errEl.textContent = '';
    if(!hasStorage){ errEl.textContent='Online play needs the Claude artifact environment.'; return; }
    const code = document.getElementById('joinInput').value.trim().toUpperCase();
    if(code.length < 3){ errEl.textContent = 'enter a valid code'; return; }
    const room = await sGet('zw:'+code);
    if(!room){ errEl.textContent = 'room not found'; return; }
    if(room.status === 'full' || room.status === 'live'){ errEl.textContent = 'room already full'; return; }
    roomCode = code; myId = 'p2'; oppId = 'p1';
    gameStartTime = Date.now() + 1500;
    await sSet('zw:'+roomCode, { status:'live', createdAt: room.createdAt, gameStartTime });
    startGame();
  });

  document.getElementById('btnCancelWait').addEventListener('click', ()=>{
    clearInterval(pollTimer);
    showScreen('home');
  });

  async function pollForOpponent(){
    clearInterval(pollTimer);
    pollTimer = setInterval(async ()=>{
      const room = await sGet('zw:'+roomCode);
      if(room && room.status === 'live' && room.gameStartTime){
        clearInterval(pollTimer);
        gameStartTime = room.gameStartTime;
        startGame();
      }
    }, 700);
  }

  /* ---------------- CANVAS SETUP ---------------- */
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  let dpr = Math.min(window.devicePixelRatio||1, 2);
  let cssSize = 300;

  function resizeCanvas(){
    const wrap = document.getElementById('arenaWrap');
    const s = Math.min(wrap.clientWidth, wrap.clientHeight) * 0.98;
    cssSize = s;
    canvas.style.width = s+'px';
    canvas.style.height = s+'px';
    canvas.width = s*dpr;
    canvas.height = s*dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize', resizeCanvas);

  function toScreen(x,y){
    const scale = cssSize/ARENA;
    return [x*scale, y*scale];
  }

  /* ---------------- JOYSTICKS ---------------- */
  function makeStick(zoneId, baseId, nubId, isAim){
    const zone = document.getElementById(zoneId);
    const base = document.getElementById(baseId);
    const nub = document.getElementById(nubId);
    let active=false, touchId=null, cx=0, cy=0;
    const maxR = 50;
    const vec = { x:0, y:0, mag:0 };

    function start(clientX, clientY){
      active = true;
      cx = clientX; cy = clientY;
      base.style.left = (clientX - zone.getBoundingClientRect().left - 52) + 'px';
      base.style.top = (clientY - zone.getBoundingClientRect().top - 52) + 'px';
      base.style.display = 'block';
      move(clientX, clientY);
    }
    function move(clientX, clientY){
      if(!active) return;
      let dx = clientX-cx, dy = clientY-cy;
      const dist = Math.hypot(dx,dy);
      const clamped = Math.min(dist, maxR);
      const ang = Math.atan2(dy,dx);
      const nx = Math.cos(ang)*clamped, ny = Math.sin(ang)*clamped;
      nub.style.transform = `translate(calc(-50% + ${nx}px), calc(-50% + ${ny}px))`;
      vec.x = dist? dx/dist : 0; vec.y = dist? dy/dist:0;
      vec.mag = clamped/maxR;
      if(isAim && vec.mag > 0.25){ me.angle = Math.atan2(vec.y, vec.x); }
    }
    function end(){
      active = false; touchId = null;
      base.style.display = 'none';
      nub.style.transform = 'translate(-50%,-50%)';
      vec.x=0; vec.y=0; vec.mag=0;
    }
    zone.addEventListener('touchstart', e=>{
      e.preventDefault();
      if(touchId!==null) return;
      const t = e.changedTouches[0];
      touchId = t.identifier;
      start(t.clientX, t.clientY);
    }, {passive:false});
    zone.addEventListener('touchmove', e=>{
      e.preventDefault();
      for(const t of e.changedTouches){ if(t.identifier===touchId) move(t.clientX,t.clientY); }
    }, {passive:false});
    zone.addEventListener('touchend', e=>{
      e.preventDefault();
      for(const t of e.changedTouches){ if(t.identifier===touchId) end(); }
    }, {passive:false});
    // mouse fallback (desktop testing)
    zone.addEventListener('mousedown', e=>{ start(e.clientX,e.clientY); });
    window.addEventListener('mousemove', e=>{ if(active && touchId===null) move(e.clientX,e.clientY); });
    window.addEventListener('mouseup', ()=>{ if(active && touchId===null) end(); });
    return vec;
  }

  let moveVec, aimVec;

  /* ---------------- GAME START ---------------- */
  async function startGame(){
    document.getElementById('connBadge').textContent = 'connected · room ' + roomCode;
    me.x = myId==='p1' ? 300 : 700;
    me.y = 500;
    me.health = 100;
    enemy.x = myId==='p1' ? 700 : 300;
    enemy.y = 500;
    enemy.prevX = enemy.x; enemy.prevY = enemy.y;
    enemy.health = 100; enemy.alive = true; enemy.joined = false;
    over = false;

    resizeCanvas();
    if(!moveVec){
      moveVec = makeStick('moveZone','moveBase','moveNub', false);
      aimVec = makeStick('aimZone','aimBase','aimNub', true);
    }
    showScreen('game');

    if(!gameStartTime){
      const room = await sGet('zw:'+roomCode);
      gameStartTime = (room && room.gameStartTime) || Date.now();
    }

    clearInterval(writeTimer);
    writeTimer = setInterval(writeState, WRITE_INTERVAL);
    clearInterval(pollTimer);
    pollTimer = setInterval(pollOpponent, POLL_INTERVAL);

    let last = performance.now();
    function loop(now){
      const dt = Math.min((now-last)/1000, 0.05);
      last = now;
      update(dt);
      render();
      if(!over) rafId = requestAnimationFrame(loop);
    }
    rafId = requestAnimationFrame(loop);
  }

  function zoneRadiusNow(){
    const elapsed = Date.now() - gameStartTime;
    const t = Math.max(0, Math.min(1, elapsed/ZONE_DURATION));
    return ZONE_START_R - (ZONE_START_R-ZONE_END_R)*t;
  }

  /* ---------------- UPDATE ---------------- */
  function update(dt){
    if(over) return;
    // movement
    if(moveVec && moveVec.mag>0.15){
      me.x += moveVec.x*moveVec.mag*MOVE_SPEED*dt;
      me.y += moveVec.y*moveVec.mag*MOVE_SPEED*dt;
      me.x = Math.max(PLAYER_R, Math.min(ARENA-PLAYER_R, me.x));
      me.y = Math.max(PLAYER_R, Math.min(ARENA-PLAYER_R, me.y));
      if(!(aimVec && aimVec.mag>0.25)) me.angle = Math.atan2(moveVec.y, moveVec.x);
    }
    // firing
    if(aimVec && aimVec.mag > 0.3){
      const t = Date.now();
      if(t - me.lastShotAt > FIRE_COOLDOWN){
        me.lastShotAt = t;
        const shot = { id: t+'_'+Math.random().toString(36).slice(2,6), x:me.x, y:me.y, angle: me.angle, t };
        me.shots.push(shot);
        if(me.shots.length>6) me.shots.shift();
      }
    }
    // zone damage
    const zr = zoneRadiusNow();
    const distFromCenter = Math.hypot(me.x-ARENA/2, me.y-ARENA/2);
    if(distFromCenter > zr){
      me.health = Math.max(0, me.health - ZONE_DPS*dt);
    }
    // incoming shots from enemy -> check hit against me
    for(const shot of enemy.shots){
      if(enemy.seenShots.has(shot.id)) continue;
      enemy.seenShots.add(shot.id);
      const travel = Math.max(0, (Date.now()-shot.t)/1000) * BULLET_SPEED;
      const cappedTravel = Math.min(travel, 1400);
      const ex = shot.x + Math.cos(shot.angle)*cappedTravel;
      const ey = shot.y + Math.sin(shot.angle)*cappedTravel;
      const d = pointToSegmentDist(me.x, me.y, shot.x, shot.y, ex, ey);
      if(d < PLAYER_R + BULLET_R){
        me.health = Math.max(0, me.health - BULLET_DAMAGE);
      }
    }

    if(me.health<=0 || (enemy.joined && enemy.health<=0)){
      endGame();
    }
  }

  function pointToSegmentDist(px,py, x1,y1, x2,y2){
    const dx=x2-x1, dy=y2-y1;
    const len2 = dx*dx+dy*dy;
    let t = len2>0 ? ((px-x1)*dx+(py-y1)*dy)/len2 : 0;
    t = Math.max(0, Math.min(1,t));
    const cx = x1+dx*t, cy = y1+dy*t;
    return Math.hypot(px-cx, py-cy);
  }

  async function writeState(){
    if(!roomCode) return;
    try{
      await sSet('zw:'+roomCode+':'+myId, {
        x: me.x, y: me.y, angle: me.angle, health: me.health,
        shots: me.shots, t: Date.now(), alive: me.health>0
      });
    }catch(e){}
  }

  async function pollOpponent(){
    if(!roomCode) return;
    const data = await sGet('zw:'+roomCode+':'+oppId);
    if(data){
      enemy.joined = true;
      enemy.prevX = enemy.x; enemy.prevY = enemy.y; enemy.prevSnapT = enemy.snapT;
      enemy.targetX = data.x; enemy.targetY = data.y;
      enemy.snapT = Date.now();
      enemy.angle = data.angle;
      enemy.health = data.health;
      enemy.shots = data.shots || [];
      enemy.alive = data.alive;
      document.getElementById('connBadge').textContent = 'live';
    }
  }

  function endGame(){
    if(over) return;
    over = true;
    cancelAnimationFrame(rafId);
    clearInterval(writeTimer);
    clearInterval(pollTimer);
    writeState();
    const iWon = me.health>0;
    document.getElementById('resultText').textContent = iWon ? 'YOU WIN' : 'ELIMINATED';
    document.getElementById('resultText').className = 'result ' + (iWon?'win':'lose');
    document.getElementById('resultSub').textContent = iWon ? 'enemy eliminated' : 'better luck next drop';
    showScreen('over');
  }

  document.getElementById('btnPlayAgain').addEventListener('click', ()=>{
    roomCode = null; myId = null; oppId = null; gameStartTime = null;
    me.health = 100; me.shots = []; me.processedShots = new Set();
    enemy.health = 100; enemy.shots = []; enemy.seenShots = new Set(); enemy.joined = false;
    document.getElementById('joinInput').value = '';
    document.getElementById('joinBox').classList.add('hidden');
    showScreen('home');
  });

  /* ---------------- RENDER ---------------- */
  function render(){
    ctx.clearRect(0,0,cssSize,cssSize);
    const scale = cssSize/ARENA;

    // arena bg grid
    ctx.fillStyle = '#12150d';
    ctx.fillRect(0,0,cssSize,cssSize);
    ctx.strokeStyle = 'rgba(124,143,74,0.08)';
    ctx.lineWidth = 1;
    for(let gx=0; gx<=ARENA; gx+=50){
      ctx.beginPath(); ctx.moveTo(gx*scale,0); ctx.lineTo(gx*scale,cssSize); ctx.stroke();
    }
    for(let gy=0; gy<=ARENA; gy+=50){
      ctx.beginPath(); ctx.moveTo(0,gy*scale); ctx.lineTo(cssSize,gy*scale); ctx.stroke();
    }

    // danger zone (outside safe circle)
    const zr = zoneRadiusNow()*scale;
    const [ccx,ccy] = toScreen(ARENA/2, ARENA/2);
    ctx.save();
    ctx.beginPath();
    ctx.rect(0,0,cssSize,cssSize);
    ctx.arc(ccx,ccy,zr,0,Math.PI*2,true);
    ctx.fillStyle = 'rgba(226,64,47,0.18)';
    ctx.fill('evenodd');
    ctx.restore();
    ctx.beginPath();
    ctx.arc(ccx,ccy,zr,0,Math.PI*2);
    ctx.strokeStyle = '#ff6a1f';
    ctx.lineWidth = 3;
    ctx.stroke();

    // enemy interpolated position
    let ex = enemy.x, ey = enemy.y;
    if(enemy.targetX!==undefined){
      const span = Math.max(1, POLL_INTERVAL);
      const p = Math.min(1, (Date.now()-enemy.snapT+span)/span);
      ex = enemy.prevX + (enemy.targetX-enemy.prevX)*Math.min(1,p);
      ey = enemy.prevY + (enemy.targetY-enemy.prevY)*Math.min(1,p);
      enemy.x = ex; enemy.y = ey;
    }

    // draw bullets (mine + enemy's)
    drawShots(me.shots, '#a3bb5f');
    drawShots(enemy.shots, '#ff8a6a');

    // draw players
    if(enemy.joined) drawPlayer(ex, ey, enemy.angle, '#e2402f', enemy.health);
    drawPlayer(me.x, me.y, me.angle, '#7c8f4a', me.health);

    // HUD bars
    document.getElementById('myHealthBar').style.width = Math.max(0,me.health)+'%';
    document.getElementById('enemyHealthBar').style.width = Math.max(0,enemy.health)+'%';
    const secLeft = Math.max(0, Math.ceil((ZONE_DURATION-(Date.now()-gameStartTime))/1000));
    document.getElementById('zoneTimer').textContent = zoneRadiusNow()<=ZONE_END_R+1 ? 'ZONE CLOSED' : ('ZONE CLOSING · '+secLeft+'s');
  }

  function drawShots(shots, color){
    const scale = cssSize/ARENA;
    for(const s of shots){
      const travel = Math.min(Math.max(0,(Date.now()-s.t)/1000)*BULLET_SPEED, 1400);
      if(travel<=0 || travel>=1400) continue;
      const bx = s.x+Math.cos(s.angle)*travel;
      const by = s.y+Math.sin(s.angle)*travel;
      if(bx<0||bx>ARENA||by<0||by>ARENA) continue;
      const [sx,sy] = toScreen(bx,by);
      ctx.beginPath();
      ctx.arc(sx,sy,BULLET_R*scale,0,Math.PI*2);
      ctx.fillStyle = color;
      ctx.shadowColor = color; ctx.shadowBlur = 8;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawPlayer(x,y,angle,color,health){
    const scale = cssSize/ARENA;
    const [sx,sy] = toScreen(x,y);
    const r = PLAYER_R*scale;
    ctx.save();
    ctx.translate(sx,sy);
    // facing indicator
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(r*1.6,0); ctx.lineTo(r*0.6,r*0.55); ctx.lineTo(r*0.6,-r*0.55); ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
    // body
    ctx.beginPath();
    ctx.arc(sx,sy,r,0,Math.PI*2);
    ctx.fillStyle = '#0c0d09';
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = health<=0? '#444' : color;
    ctx.stroke();
  }

  window.addEventListener('load', ()=>{
    resizeCanvas();
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('service-worker.js').catch(()=>{});
    }
  });
})();
</script>
</body>
</html>
